//
// build.gradle - S912 codec app (Android 7.1.2 / API 25, min 21)
//
// Prebuilt FFmpeg + libsrt: scripts/build_libsrt.sh + scripts/build_ffmpeg.sh
// (GitHub Actions bunlari otomatik derler; lokal icin README'ye bak).
//
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.amlogic.codec"
    compileSdk 33
    // CI'da 25.1.8937393; lokal testte -Ps912NdkVersion=... ile degistirilebilir.
    ndkVersion project.findProperty("s912NdkVersion") ?: "25.1.8937393"

    defaultConfig {
        applicationId "com.amlogic.codec"
        minSdk 21
        targetSdk 25
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // libsrt static olarak derlenir; codec_core ile ayni C++ STL'i kullan.
                arguments "-DANDROID_ABI=arm64-v8a",
                          "-DANDROID_PLATFORM=android-21",
                          "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Sabit imza anahtari: her CI derlemesi ayni imzayi tasir, boylece
    // "INSTALL_FAILED_UPDATE_INCOMPATIBLE" olmadan uzerine kurulabilir.
    // (Sadece bu uygulama icin; sir degil, bilerek repoda.)
    signingConfigs {
        stable {
            storeFile file("../keystore/s912-codec.jks")
            storePassword "s912codec"
            keyAlias "s912codec"
            keyPassword "s912codec"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ["jniLibs"]
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    lint {
        // Cihaz Android 7.1.2 (API 25) ve uygulama Play Store'a yuklenmiyor;
        // targetSdk bilincli olarak 25. (Lint bunu "error" sayip build'i durduruyordu.)
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}
